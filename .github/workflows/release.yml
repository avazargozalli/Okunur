name: Sürüm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: npm ve GitHub sürümü
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Depoyu al
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Node.js kur
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"

      - name: Sürüm etiketini denetle ve notları çıkar
        shell: bash
        run: |
          set -euo pipefail
          version="$(node --print 'require("./package.json").version')"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Etiket ($GITHUB_REF_NAME) ile paket sürümü (v$version) uyuşmuyor." >&2
            exit 1
          fi
          awk -v ver="$version" '
            index($0, "## [" ver "]") == 1 { found = 1; next }
            found && (/^## \[/ || /^\[[^]]+\]:/) { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
            echo "CHANGELOG.md içinde $version için sürüm notu bulunamadı." >&2
            exit 1
          fi

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Tam denetim
        run: npm run check

      - name: npm arşivini hazırla ve kayıt defterini denetle
        id: package
        shell: bash
        run: |
          set -euo pipefail
          pack_info="$RUNNER_TEMP/npm-pack.json"
          npm pack --json --pack-destination "$RUNNER_TEMP" > "$pack_info"
          archive="$(node --print 'require(process.argv[1])[0].filename' "$pack_info")"
          package_spec="$(node --print 'require(process.argv[1])[0].id' "$pack_info")"
          registry_path="$(node --print 'const p = require(process.argv[1])[0]; encodeURIComponent(p.name) + "/" + p.version' "$pack_info")"
          printf 'archive=%s\n' "$RUNNER_TEMP/$archive" >> "$GITHUB_OUTPUT"
          registry_info="$RUNNER_TEMP/npm-version.json"
          registry_http="$(curl --silent --show-error --retry 2 --max-time 15 --output "$registry_info" \
            --write-out '%{http_code}' "https://registry.npmjs.org/$registry_path")"
          case "$registry_http" in
            404)
              echo "$package_spec yeni bir npm sürümü olarak yayımlanabilir."
              echo "published=false" >> "$GITHUB_OUTPUT"
              ;;
            200)
              local_integrity="$(node --print 'require(process.argv[1])[0].integrity' "$pack_info")"
              published_integrity="$(node --print 'require(process.argv[1]).dist.integrity' "$registry_info")"
              if [[ "$published_integrity" != "$local_integrity" ]]; then
                published_dir="$RUNNER_TEMP/published-npm"
                mkdir -p "$published_dir"
                npm pack "$package_spec" --ignore-scripts --json --pack-destination "$published_dir" \
                  > "$published_dir/pack.json"
                downloaded_integrity="$(node --print 'require(process.argv[1])[0].integrity' "$published_dir/pack.json")"
                if [[ "$downloaded_integrity" != "$published_integrity" ]]; then
                  echo "İndirilen npm arşivinin bütünlük özeti kayıt defteriyle uyuşmuyor." >&2
                  exit 1
                fi
                python3 -I .github/scripts/compare_npm_archives.py "$RUNNER_TEMP/$archive" "$published_dir/$archive"
              fi
              echo "$package_spec npm'de eşleşen içerikle yayımlanmış."
              echo "published=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "npm kayıt defteri HTTP $registry_http döndürdü." >&2
              exit 1
              ;;
          esac

      - name: npm paketini yayımla
        if: github.event_name == 'push' && steps.package.outputs.published == 'false'
        env:
          NPM_ARCHIVE: ${{ steps.package.outputs.archive }}
        run: npm publish "$NPM_ARCHIVE"

      - name: GitHub sürümü oluştur
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if ! gh release view "$GITHUB_REF_NAME" --json url --jq .url 2>/dev/null; then
            gh release create "$GITHUB_REF_NAME" \
              --title "okunur $version" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --verify-tag
          fi
